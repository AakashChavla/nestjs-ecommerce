<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Location</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f5f5f5;
      }

      /* ── Top bar ─────────────────────────────────────────── */
      .top-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        z-index: 10;
      }

      #search-input {
        flex: 1;
        padding: 10px 14px;
        font-size: 14px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s;
      }

      #search-input:focus {
        border-color: #4285f4;
      }

      /* ── Map ─────────────────────────────────────────────── */
      #map {
        flex: 1;
        width: 100%;
      }

      /* ── Bottom panel ─────────────────────────────────────── */
      .bottom-panel {
        background: #fff;
        padding: 16px;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
        z-index: 10;
      }

      .coords-row {
        display: flex;
        gap: 12px;
        margin-bottom: 10px;
      }

      .coord-field {
        flex: 1;
      }

      .coord-field label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }

      .coord-field input {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        border: 1.5px solid #d1d5db;
        border-radius: 6px;
        background: #f9fafb;
        outline: none;
      }

      #formatted-address {
        font-size: 13px;
        color: #374151;
        min-height: 18px;
        margin-bottom: 14px;
        padding: 8px 10px;
        background: #f3f4f6;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
      }

      #confirm-btn {
        width: 100%;
        padding: 12px;
        background: #4285f4;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      #confirm-btn:hover {
        background: #3367d6;
      }

      #confirm-btn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      .status-msg {
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
        margin-top: 8px;
      }
    </style>
  </head>

  <body>
    <!-- Search bar with Places Autocomplete -->
    <div class="top-bar">
      <input
        id="search-input"
        type="text"
        placeholder="Search for an address…"
        autocomplete="off"
      />
    </div>

    <!-- Interactive map -->
    <div id="map"></div>

    <!-- Coordinates + confirm -->
    <div class="bottom-panel">
      <div class="coords-row">
        <div class="coord-field">
          <label>Latitude</label>
          <input id="lat-input" type="text" readonly placeholder="—" />
        </div>
        <div class="coord-field">
          <label>Longitude</label>
          <input id="lng-input" type="text" readonly placeholder="—" />
        </div>
      </div>

      <div id="formatted-address">Pin a location or search above</div>

      <button id="confirm-btn" disabled>Confirm Location</button>
      <p class="status-msg" id="status-msg"></p>
    </div>

    <script>
      // ── Google Maps config ────────────────────────────────────
      // Change ONLY this variable — nothing else in this file needs editing.
      // In production, your backend injects this at render time instead of
      // hardcoding it here (e.g. res.render('map', { apiKey })).
      const GOOGLE_MAPS_API_KEY = '';

      const GOOGLE_MAPS_BASE_URL = 'https://maps.googleapis.com/maps/api/js';
      const GOOGLE_MAPS_LIBRARIES = 'places';

      // Build and inject the Maps JS script tag dynamically
      const mapsScriptUrl = new URL(GOOGLE_MAPS_BASE_URL);
      mapsScriptUrl.searchParams.set('key', GOOGLE_MAPS_API_KEY);
      mapsScriptUrl.searchParams.set('libraries', GOOGLE_MAPS_LIBRARIES);
      mapsScriptUrl.searchParams.set('callback', 'initMap');

      const mapsScript = document.createElement('script');
      mapsScript.src = mapsScriptUrl.toString();
      mapsScript.async = true;
      mapsScript.defer = true;
      document.head.appendChild(mapsScript);
    </script>

    <script>
      // ── State ────────────────────────────────────────────────
      let map, marker, geocoder;
      let selectedLat = null;
      let selectedLng = null;

      // ── DOM refs ─────────────────────────────────────────────
      const latInput = document.getElementById('lat-input');
      const lngInput = document.getElementById('lng-input');
      const addressDiv = document.getElementById('formatted-address');
      const confirmBtn = document.getElementById('confirm-btn');
      const statusMsg = document.getElementById('status-msg');
      const searchInput = document.getElementById('search-input');

      // ── Initialise map ───────────────────────────────────────
      function initMap() {
        geocoder = new google.maps.Geocoder();

        // Default center: India
        const defaultCenter = { lat: 20.5937, lng: 78.9629 };

        map = new google.maps.Map(document.getElementById('map'), {
          center: defaultCenter,
          zoom: 5,
          mapTypeControl: false,
          streetViewControl: false,
          fullscreenControl: false,
          zoomControlOptions: {
            position: google.maps.ControlPosition.RIGHT_CENTER,
          },
        });

        marker = new google.maps.Marker({
          map,
          draggable: true,
          visible: false,
          title: 'Drag to adjust',
        });

        // Click on map → place/move marker
        map.addListener('click', (e) => {
          placeMarker(e.latLng);
          reverseGeocode(e.latLng);
        });

        // Drag marker → update fields
        marker.addListener('dragend', (e) => {
          reverseGeocode(e.latLng);
          updateCoordFields(e.latLng.lat(), e.latLng.lng());
        });

        // Places Autocomplete
        const autocomplete = new google.maps.places.Autocomplete(searchInput, {
          fields: ['geometry', 'formatted_address'],
        });

        autocomplete.addListener('place_changed', () => {
          const place = autocomplete.getPlace();
          if (!place.geometry?.location) return;

          map.setCenter(place.geometry.location);
          map.setZoom(17);
          placeMarker(place.geometry.location);
          updateCoordFields(
            place.geometry.location.lat(),
            place.geometry.location.lng(),
          );
          addressDiv.textContent = place.formatted_address || '';
        });
      }

      // ── Helpers ──────────────────────────────────────────────
      function placeMarker(latLng) {
        marker.setPosition(latLng);
        marker.setVisible(true);
      }

      function updateCoordFields(lat, lng) {
        selectedLat = lat;
        selectedLng = lng;
        latInput.value = lat.toFixed(7);
        lngInput.value = lng.toFixed(7);
        confirmBtn.disabled = false;
      }

      function reverseGeocode(latLng) {
        addressDiv.textContent = 'Fetching address…';
        geocoder.geocode({ location: latLng }, (results, status) => {
          if (status === 'OK' && results[0]) {
            addressDiv.textContent = results[0].formatted_address;
          } else {
            addressDiv.textContent = 'Address not found';
          }
        });
        updateCoordFields(latLng.lat(), latLng.lng());
      }

      // ── Confirm button ───────────────────────────────────────
      confirmBtn.addEventListener('click', () => {
        if (selectedLat === null || selectedLng === null) return;

        const payload = {
          latitude: selectedLat,
          longitude: selectedLng,
          formattedAddress: addressDiv.textContent,
        };

        /**
         * Option A — postMessage (iframe usage):
         *   window.parent.postMessage(payload, '*');
         *
         * Option B — URL callback (redirect):
         *   window.location.href = `/address/confirm?lat=${payload.latitude}&lng=${payload.longitude}`;
         *
         * Option C — fetch (API call):
         *   await fetch('/api/address/coordinates', { method: 'POST', body: JSON.stringify(payload) });
         *
         * Uncomment the option that fits your frontend integration.
         */

        // Default: postMessage so a parent window/iframe can receive the result
        window.parent.postMessage(
          { type: 'LOCATION_SELECTED', ...payload },
          '*',
        );

        statusMsg.textContent = `Location confirmed: ${payload.latitude.toFixed(5)}, ${payload.longitude.toFixed(5)}`;
        confirmBtn.textContent = '✓ Confirmed';
        confirmBtn.disabled = true;
      });
    </script>


  </body>
</html>
